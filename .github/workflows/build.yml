name: Maven Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
      - name: Build with Maven
        run: mvn --no-transfer-progress --batch-mode verify -U
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
      - name: Publish Test Report
        if: ${{ always() }}
        uses: ScalableCapital/action-surefire-report@v2
