name: Native Image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  NFPM_VERSION: "2.47.0"

jobs:
  linux:
    name: Build native image for Linux (${{ matrix.arch }})
    strategy:
      # a failing architecture must not cancel the release of the other
      fail-fast: false
      matrix:
        include:
          # statically linked against musl, see profile linux in pom.xml
          - arch: amd64
            runner: ubuntu-latest
            rpm: x86_64
            deb-depends: ""
            rpm-depends: ""
            # Digest of nfpm_${NFPM_VERSION}_amd64.deb, see
            # https://github.com/goreleaser/nfpm/releases/download/v2.47.0/checksums.txt
            nfpm-sha256: "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97"
          # musl is not supported on aarch64; linked dynamically against glibc only, see profile linux-aarch64 in pom.xml.
          # Built on Ubuntu 22.04 to require no newer glibc than 2.34.
          - arch: arm64
            runner: ubuntu-22.04-arm
            rpm: aarch64
            deb-depends: "libc6 (>= 2.34)"
            rpm-depends: "glibc >= 2.34"
            # Digest of nfpm_${NFPM_VERSION}_arm64.deb
            nfpm-sha256: "27419eb382695a7942be8ad52259f3ec1854fad001b3ae4baed34ce39a223b97"
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
      - name: Install musl tools
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-dev musl-tools
          # Build and install zlib for musl (libz-dev only provides glibc-linked libz.a,
          # which is not found by the musl linker during --static --libc=musl native image builds)
          cd /tmp
          curl -fsSL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz -o zlib-1.3.1.tar.gz
          echo "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  zlib-1.3.1.tar.gz" | sha256sum -c
          tar xzf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          CC=x86_64-linux-musl-gcc ./configure --static --prefix=/usr/local
          make -j$(nproc)
          sudo cp libz.a /usr/lib/x86_64-linux-musl/
      - name: Build native image
        run: >
          mvn --batch-mode verify -Pnative
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
      - name: Determine package version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          else
            # Non-tag builds are never published; use a plain version rpm/deb accept.
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate bash completion
        run: target/katta completion --shell bash > target/katta.bash
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.arch }}.deb" -o /tmp/nfpm.deb
          echo "${{ matrix.nfpm-sha256 }}  /tmp/nfpm.deb" | sha256sum -c
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
          DEB_DEPENDS: ${{ matrix.deb-depends }}
          RPM_DEPENDS: ${{ matrix.rpm-depends }}
        run: |
          # Version-less filenames keep the releases/latest/download/ URLs stable;
          # the package version lives in the .deb/.rpm metadata.
          nfpm package -f src/deploy/nfpm.yaml -p deb -t target/katta_${{ matrix.arch }}.deb
          nfpm package -f src/deploy/nfpm.yaml -p rpm -t target/katta.${{ matrix.rpm }}.rpm
          cp target/katta target/katta-linux-${{ matrix.arch }}
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            target/katta-linux-${{ matrix.arch }}
            target/katta_${{ matrix.arch }}.deb
            target/katta.${{ matrix.rpm }}.rpm
      # Unarchived uploads take the file name as the artifact name.
      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          path: target/katta-linux-${{ matrix.arch }}
          archive: false
          if-no-files-found: error
      - name: Upload .deb package
        uses: actions/upload-artifact@v7
        with:
          path: target/katta_${{ matrix.arch }}.deb
          archive: false
          if-no-files-found: error
      - name: Upload .rpm package
        uses: actions/upload-artifact@v7
        with:
          path: target/katta.${{ matrix.rpm }}.rpm
          archive: false
          if-no-files-found: error
      - name: Publish Linux packages on Github Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/katta-linux-${{ matrix.arch }}
            target/katta_${{ matrix.arch }}.deb
            target/katta.${{ matrix.rpm }}.rpm

  image:
    name: Build and push container image
    needs: linux
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Unarchived uploads take the file name as the artifact name.
      - uses: actions/download-artifact@v8
        with:
          name: katta-linux-amd64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: katta-linux-arm64
          path: dist
      - name: Determine image version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          else
            # Non-tag builds are never pushed; the image is only built to verify the Dockerfile.
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push container image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: dist
          file: src/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/shift7-ch/katta-admin-cli:${{ steps.version.outputs.value }}
            ghcr.io/shift7-ch/katta-admin-cli:latest
          labels: |
            org.opencontainers.image.title=Katta Admin CLI
            org.opencontainers.image.vendor=shift7 GmbH
            org.opencontainers.image.source=https://github.com/shift7-ch/katta-admin-cli
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Generate artifact attestation
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/shift7-ch/katta-admin-cli
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  macos:
    name: Build native image for macOS
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: [ self-hosted, macos ]
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
      - name: Build native image
        run: >
          mvn --batch-mode verify -Pnative
      # The Homebrew formula generates the shell completions from the binary itself,
      # so the tarball only needs to ship the executable.
      - name: Package macOS tarball
        run: |
          tar czf target/katta-macos-arm64.tar.gz -C target katta
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: target/katta-macos-arm64.tar.gz
      - name: Upload macOS tarball
        uses: actions/upload-artifact@v7
        with:
          path: target/katta-macos-arm64.tar.gz
          archive: false
          if-no-files-found: error
      - name: Publish macOS tarball on Github Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/katta-macos-arm64.tar.gz

  homebrew:
    name: Update Homebrew tap
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: katta-macos-arm64.tar.gz
          path: dist
      - name: Render and push formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF##*/}"
          SHA256="$(sha256sum dist/katta-macos-arm64.tar.gz | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__SHA256_MACOS_ARM64__/${SHA256}/g" \
              src/deploy/katta.rb > katta.rb

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/shift7-ch/homebrew-katta.git" tap
          mkdir -p tap/Formula
          cp katta.rb tap/Formula/katta.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/katta.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "katta ${VERSION}"
          git push
