name: Native Image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  NFPM_VERSION: "2.47.0"
  # Digest of nfpm_${NFPM_VERSION}_amd64.deb, see
  # https://github.com/goreleaser/nfpm/releases/download/v2.47.0/checksums.txt
  NFPM_SHA256: "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97"

jobs:
  linux:
    name: Build native image for Linux
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
      - name: Install musl tools
        run: |
          sudo apt-get update && sudo apt-get install -y musl-dev musl-tools
          # Build and install zlib for musl (libz-dev only provides glibc-linked libz.a,
          # which is not found by the musl linker during --static --libc=musl native image builds)
          cd /tmp
          curl -fsSL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz -o zlib-1.3.1.tar.gz
          echo "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  zlib-1.3.1.tar.gz" | sha256sum -c
          tar xzf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          CC=x86_64-linux-musl-gcc ./configure --static --prefix=/usr/local
          make -j$(nproc)
          sudo cp libz.a /usr/lib/x86_64-linux-musl/
      - name: Build native image
        run: >
          mvn --batch-mode verify -Pnative
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
      - name: Determine package version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          else
            # Non-tag builds are never published; use a plain version rpm/deb accept.
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate bash completion
        run: target/katta completion --shell bash > target/katta.bash
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          echo "${NFPM_SHA256}  /tmp/nfpm.deb" | sha256sum -c
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Version-less filenames keep the releases/latest/download/ URLs stable;
          # the package version lives in the .deb/.rpm metadata.
          nfpm package -f src/deploy/nfpm.yaml -p deb -t target/katta_amd64.deb
          nfpm package -f src/deploy/nfpm.yaml -p rpm -t target/katta.x86_64.rpm
          cp target/katta target/katta-linux-amd64
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            target/katta-linux-amd64
            target/katta_amd64.deb
            target/katta.x86_64.rpm
      # Unarchived uploads take the file name as the artifact name.
      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          path: target/katta-linux-amd64
          archive: false
          if-no-files-found: error
      - name: Upload .deb package
        uses: actions/upload-artifact@v7
        with:
          path: target/katta_amd64.deb
          archive: false
          if-no-files-found: error
      - name: Upload .rpm package
        uses: actions/upload-artifact@v7
        with:
          path: target/katta.x86_64.rpm
          archive: false
          if-no-files-found: error
      - name: Publish Linux packages on Github Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            target/katta-linux-amd64
            target/katta_amd64.deb
            target/katta.x86_64.rpm

  macos:
    name: Build native image for macOS
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: [ self-hosted, macos ]
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
      - name: Build native image
        run: >
          mvn --batch-mode verify -Pnative
      # The Homebrew formula generates the shell completions from the binary itself,
      # so the tarball only needs to ship the executable.
      - name: Package macOS tarball
        run: |
          tar czf target/katta-macos-arm64.tar.gz -C target katta
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: target/katta-macos-arm64.tar.gz
      - name: Upload macOS tarball
        uses: actions/upload-artifact@v7
        with:
          path: target/katta-macos-arm64.tar.gz
          archive: false
          if-no-files-found: error
      - name: Publish macOS tarball on Github Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            target/katta-macos-arm64.tar.gz

  homebrew:
    name: Update Homebrew tap
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: katta-macos-arm64.tar.gz
          path: dist
      - name: Render and push formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF##*/}"
          SHA256="$(sha256sum dist/katta-macos-arm64.tar.gz | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/g" \
              -e "s/__SHA256_MACOS_ARM64__/${SHA256}/g" \
              src/deploy/katta.rb > katta.rb

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/shift7-ch/homebrew-katta.git" tap
          mkdir -p tap/Formula
          cp katta.rb tap/Formula/katta.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/katta.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "katta ${VERSION}"
          git push
