# nfpm configuration for the Katta Admin CLI Linux packages (.deb / .rpm).
# Rendered and consumed by .github/workflows/release.yml on tag builds, with ARCH set to amd64 or arm64
# (nfpm maps it to x86_64 or aarch64 for .rpm).
# See https://nfpm.goreleaser.com/configuration/
name: katta
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
maintainer: "shift7 GmbH <noreply@shift7.ch>"
description: |
  Katta Admin CLI.
  Configure a Katta Server including its S3 storage backend: AWS S3 with static
  access keys, AWS STS with OIDC, generic S3-compatible providers and MinIO STS.
vendor: "shift7 GmbH"
homepage: "https://katta.cloud/"
license: "AGPL-3.0-or-later"
section: utils
priority: optional
contents:
  - src: ./target/katta
    dst: /usr/bin/katta
    file_info:
      mode: 0755
  - src: ./target/katta.bash
    dst: /usr/share/bash-completion/completions/katta
    file_info:
      mode: 0644
